services:
  - type: web
    name: farmitron-api
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r ai-backend/requirements.txt
    startCommand: python3 -m uvicorn ai-backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false
